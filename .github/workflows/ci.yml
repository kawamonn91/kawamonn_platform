name: CI

on:
  push:
    branches: [main]
    paths:
      - 'kawamonn-storage/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'kawamonn-storage/**'
      - '.github/workflows/ci.yml'

# 同じブランチで新しい push があったら、古い実行は取り消す
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint / unit / e2e / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kawamonn-storage/kawamonn-storage-backend
    steps:
      - uses: actions/checkout@v4

      # 本番(PM2)と同じ Node.js のバージョンでテストする
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: kawamonn-storage/kawamonn-storage-backend/package-lock.json

      # package-lock.json どおりに入れる(npm install と違い、ロックファイルとの不一致を失敗として検出できる)
      - name: Install dependencies
        run: npm ci

      # 自動修正なしで ESLint + Prettier を実行し、1件でもあれば失敗させる
      - name: Lint
        run: npm run lint:check

      # Reuses the project's own docker-compose.test.yml — the exact same
      # throwaway Postgres/Redis/MinIO used for local `npm run test:e2e`,
      # so CI and local dev can never drift apart. (GitHub Actions' native
      # `services:` block can't override MinIO's start command, which is why
      # this uses docker compose directly instead.)
      - name: Start ephemeral test services (Postgres/Redis/MinIO)
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for Postgres to accept connections
        run: |
          for i in $(seq 1 30); do
            docker compose -f docker-compose.test.yml exec -T test-db pg_isready -U test && break
            sleep 2
          done

      # prisma db push does not create extensions on its own, and the schema's
      # uuid_generate_v4() defaults need uuid-ossp to exist first.
      - name: Create required Postgres extension
        run: docker compose -f docker-compose.test.yml exec -T test-db psql -U test -d kawamonn_test -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'

      # Load .env.test's throwaway values into every later step in this job.
      # No production secret is referenced anywhere in this workflow.
      - name: Load test environment variables
        run: grep -v '^#' .env.test >> "$GITHUB_ENV"

      - name: Push Prisma schema to the test database
        run: |
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run unit tests
        run: npm test

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Tear down test services
        if: always()
        run: docker compose -f docker-compose.test.yml down

  frontend:
    name: Frontend (lint / test / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kawamonn-storage/kawamonn-storage-frontend
    steps:
      - uses: actions/checkout@v4

      # 本番で vite preview を動かしている Node.js と同じバージョン
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: kawamonn-storage/kawamonn-storage-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

  infra:
    name: Infra (shell scripts / docker compose)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kawamonn-storage
    steps:
      - uses: actions/checkout@v4

      # ヘルスチェック(cron)・ユーザー作成/削除スクリプトなど、本番で root や cron から
      # 実行されるシェルスクリプトの誤りを、warning 以上で検出する
      - name: ShellCheck
        run: shellcheck --version && git ls-files '*.sh' | xargs shellcheck -S warning

      # 本番用 docker-compose.yml の構文と値の展開を検証する(秘密情報はダミー値)
      - name: Validate production docker-compose.yml
        working-directory: kawamonn-storage/infrastructure/docker
        env:
          POSTGRES_PASSWORD: dummy
          MINIO_ROOT_USER: dummy
          MINIO_ROOT_PASSWORD: dummy-password
          CLOUDFLARE_TUNNEL_TOKEN: dummy
        run: docker compose -f docker-compose.yml config --quiet

      # バックエンドのテスト用 compose も同様に検証する
      - name: Validate docker-compose.test.yml
        working-directory: kawamonn-storage/kawamonn-storage-backend
        run: docker compose -f docker-compose.test.yml config --quiet
