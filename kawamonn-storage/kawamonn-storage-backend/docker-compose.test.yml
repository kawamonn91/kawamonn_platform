services:
  test-db:
    image: postgres:15-alpine
    container_name: kawamonn_test_db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: kawamonn_test
    ports:
      - "5433:5432" # different from production's 5432 on purpose
    tmpfs:
      - /var/lib/postgresql/data # ephemeral: no volume, wiped on every restart

  test-redis:
    image: redis:7-alpine
    container_name: kawamonn_test_redis
    ports:
      - "6380:6379" # different from production's 6379 on purpose

  test-minio:
    # MinIO no longer serves fresh pulls of this image from Docker Hub
    # (confirmed: fails with "pull access denied" on a cold GitHub Actions
    # runner). quay.io/minio/minio is their own current registry.
    image: quay.io/minio/minio:latest
    container_name: kawamonn_test_minio
    environment:
      MINIO_ROOT_USER: test-access-key
      MINIO_ROOT_PASSWORD: test-secret-key
    command: server /data
    ports:
      - "9002:9000" # different from production's 9000/9001 on purpose
      - "9003:9001"
    tmpfs:
      - /data
