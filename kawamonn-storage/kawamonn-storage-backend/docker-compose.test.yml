services:
  test-db:
    image: postgres:15-alpine
    container_name: kawamonn_test_db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: kawamonn_test
    ports:
      - "127.0.0.1:5433:5432" # different from production's 5432 on purpose; Pi の中からだけ
    tmpfs:
      - /var/lib/postgresql/data # ephemeral: no volume, wiped on every restart
