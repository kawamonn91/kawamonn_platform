services:
  test-db:
    image: postgres:15-alpine
    container_name: kawamonn_test_db
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: kawamonn_test
    ports:
      - "5433:5432" # different from production's 5432 on purpose
    tmpfs:
      - /var/lib/postgresql/data # ephemeral: no volume, wiped on every restart

  test-redis:
    image: redis:7-alpine
    container_name: kawamonn_test_redis
    ports:
      - "6380:6379" # different from production's 6379 on purpose

  test-minio:
    # MinIO 公式のビルド済みイメージは配布が終わり、Docker Hub(minio/minio)も
    # quay.io(quay.io/minio/minio)も取得できなくなった(2026-10 に CI で確認)。
    # Chainguard が MinIO のソースからビルドして配布しているイメージを使う。
    # エントリポイントが /usr/bin/minio なので、下の command はそのまま使える。
    image: cgr.dev/chainguard/minio:latest
    container_name: kawamonn_test_minio
    environment:
      MINIO_ROOT_USER: test-access-key
      MINIO_ROOT_PASSWORD: test-secret-key
    command: server /data
    ports:
      - "9002:9000" # different from production's 9000/9001 on purpose
      - "9003:9001"
    tmpfs:
      - /data
