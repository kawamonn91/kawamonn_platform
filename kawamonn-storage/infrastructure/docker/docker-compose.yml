services:
  db:
    image: postgres:15-alpine
    container_name: kawamonn_db
    environment:
      POSTGRES_USER: kawamonn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kawamonn_storage
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
      - ../docs/schema.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - kawamonn-network

  redis:
    image: redis:7-alpine
    container_name: kawamonn_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - kawamonn-network

  minio:
    image: minio/minio:latest
    container_name: kawamonn_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      - kawamonn-network

  minio-init:
    image: minio/mc:latest
    container_name: kawamonn_minio_init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set kawamonn http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb kawamonn/storage-bucket;
      mc anonymous set public kawamonn/storage-bucket;
      exit 0;
      "
    networks:
      - kawamonn-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: kawamonn_cloudflared
    network_mode: host
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped

networks:
  kawamonn-network:
    driver: bridge
