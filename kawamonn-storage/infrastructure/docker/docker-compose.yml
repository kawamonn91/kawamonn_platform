services:
  db:
    image: postgres:15-alpine
    container_name: kawamonn_db
    environment:
      POSTGRES_USER: kawamonn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kawamonn_storage
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    restart: unless-stopped
    networks:
      - kawamonn-network

  frontend:
    image: public.ecr.aws/nginx/nginx:alpine
    container_name: kawamonn_storage_web
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../kawamonn-storage-frontend/dist:/usr/share/nginx/html:ro

networks:
  kawamonn-network:
    driver: bridge
