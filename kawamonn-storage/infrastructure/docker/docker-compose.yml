services:
  db:
    image: postgres:15-alpine
    container_name: kawamonn_db
    environment:
      POSTGRES_USER: kawamonn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: kawamonn_storage
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    restart: unless-stopped
    networks:
      - kawamonn-network

networks:
  kawamonn-network:
    driver: bridge
